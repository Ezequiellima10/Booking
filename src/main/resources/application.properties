spring.application.name=booking

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking}

# --- JPA ---
# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# Dev-only default; override JWT_SECRET in any real environment
app.jwt.secret=${JWT_SECRET:4Lwkyf7eLpQkwEI7Uj/GY0yg3GCmTyt4u1nuN8hSKFs0m9ZtLNBKf4BwP1jw+aM9Ekk9KdZ8wr0fTN91c5zb5Q==}
app.jwt.expiration=${JWT_EXPIRATION:24h}

# --- Feriados Argentina ---
app.holidays.base-url=${HOLIDAYS_API_BASE_URL:https://api.argentinadatos.com}
